server.port=5000

# Colores de cada criatura (cualquier valor CSS valido: red, #FF0000, rgb(255,0,0)...)
simulacion.color.alpha=red
simulacion.color.beta=blue
simulacion.color.gamma=green

# Probabilidad de que Gamma genere un hijo por paso (1/N). Por defecto 1/5.
simulacion.gamma.prob.hijo=5

# Numero de turnos de la simulacion
simulacion.pasos=5

# Porcentaje de probabilidad (0-100) de que cada casilla genere comida en cada turno
simulacion.comida.probabilidad=20

# Turnos maximos que puede estar una criatura sin comer antes de morir
simulacion.criatura.turnos.sin.comer=5

