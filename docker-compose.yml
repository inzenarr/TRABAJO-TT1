services:
  simulacion:
    build: .
    ports:
      - "5000:5000"
    networks:
      - tt1-network

  frontend:
    profiles: ["frontend"]
    build:
      context: ${FRONTEND_PATH}
    ports:
      - "8081:8081"
    environment:
      - SIMULACION_BASE_URL=http://simulacion:5000
    networks:
      - tt1-network
    depends_on:
      - simulacion

networks:
  tt1-network:
